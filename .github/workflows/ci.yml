# Integración continua: las pruebas corren solas en cada push y en cada pull
# request. Si algo se rompe, GitHub marca el commit en rojo antes de que llegue
# a producción — que es justo cuando sale barato arreglarlo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lógica de negocio
        run: npm run test:unit

      - name: Arquitectura
        run: npm run test:arq

      # Antes de compilar: comprueba que las páginas versionadas corresponden a
      # los datos. Después de compilar siempre corresponderían.
      - name: El sitio generado corresponde a los datos
        run: npm run test:generado

      # Las pruebas de integración revisan dist/, que no se versiona. Sin este
      # paso el CI fallaba desde agosto por un dist/ que nunca existió aquí. Y
      # minifica con esbuild en Linux, como Cloudflare: si eso se rompe, se ve
      # aquí y no en un despliegue caído.
      #
      # Empaqueta, NO regenera: aquí no hay .env, y build.js escribiría un
      # catalogo-datos.js sin backend. Se prueba lo que está en git.
      - name: Empaquetar
        run: npm run empaquetar

      - name: Integración en navegador
        run: npm run test:smoke

      - name: Integridad del CSP
        run: npm run test:csp

  # La API contra un SQL Server de verdad. En la oficina es SQL Express con
  # Windows; aquí, SQL Server 2022 en un contenedor de Linux, que se crea y se
  # destruye con cada corrida. Las pruebas hacen y borran su propia base.
  servidor:
    name: Servidor (.NET + SQL Server)
    runs-on: ubuntu-latest

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # Contraseña de un contenedor que vive dos minutos y no sale de aquí.
          MSSQL_SA_PASSWORD: Prueba_CI_2026!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Prueba_CI_2026!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12

    env:
      MDC_PRUEBAS_SQL: Server=localhost,1433;User Id=sa;Password=Prueba_CI_2026!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: API contra SQL Server
        run: dotnet test servidor/Mdc.sln

