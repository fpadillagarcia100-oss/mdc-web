# Configuración de despliegue en Netlify.
#
# Las cabeceras de aquí son MÁS FUERTES que el <meta> CSP de index.html:
# el navegador las aplica antes de leer una sola línea del HTML, así que
# protegen incluso si la página llegara alterada. El <meta> se queda como
# respaldo para cuando el archivo se abre con doble clic (file://).

[build]
  publish = "."
  # Dos pasos, en este orden:
  #   db:export → trae el catálogo desde Supabase a data/catalogo.json
  #   build     → genera las fichas de equipo y el sitemap desde ese archivo
  #
  # Así el visitante nunca habla con la base de datos: recibe HTML ya escrito.
  # Si Supabase se cae, el sitio publicado sigue en pie — sólo no se puede
  # desplegar hasta que vuelva.
  #
  # Necesita SUPABASE_URL y SUPABASE_ANON_KEY en las variables de entorno del
  # proyecto en Netlify. Sin ellas, db:export se detiene con un mensaje claro
  # y el despliegue falla ANTES de generar nada — que es lo que se quiere:
  # más vale no desplegar que publicar un catálogo vacío.
  command = "npm run db:export && npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    # Impide que el sitio se incruste en un iframe ajeno (clickjacking).
    X-Frame-Options = "DENY"

    # Impide que el navegador "adivine" el tipo de un archivo. Sin esto, un
    # archivo subido como imagen podría llegar a ejecutarse como script.
    X-Content-Type-Options = "nosniff"

    # No filtra la URL completa al salir hacia WhatsApp o Google Maps.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Ninguna función del sitio necesita estos permisos. Negarlos de entrada
    # significa que el navegador ni siquiera preguntará.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    # Fuerza HTTPS durante un año, incluidos subdominios.
    # OJO: sólo activar cuando el dominio ya sirva bien por HTTPS. Es difícil
    # de revertir porque el navegador recuerda la instrucción.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://qqvwrwsxdgmhhacvgowy.supabase.co; form-action 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"

# El HTML debe revalidarse siempre: si no, un cambio tuyo tardaría horas en verse.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Las fichas de equipo se regeneran en cada despliegue: mismo trato.
[[headers]]
  for = "/equipos/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El código TAMBIÉN debe revalidarse. Los nombres de archivo no llevan versión
# (es styles.css, no styles.a1b2c3.css), así que cachearlo una hora significa
# que durante una hora la gente sigue viendo el sitio viejo — y tú también,
# aunque el despliegue ya haya terminado. Con ETag la revalidación cuesta un
# 304 de unos bytes, no la descarga completa.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Las imágenes sí se cachean: pesan, y cuando cambian lo hacen con otro nombre.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
